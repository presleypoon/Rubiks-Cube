<!DOCTYPE html>
<html lang="en">

<head>
	<title>Rubik's Cube</title>
	<link rel="stylesheet" href="Rubik's Cube.css">
</head>

<body>
	<canvas id="Rubik's Cube"></canvas>
	<div id="Buttons">
		<button onclick="Faces.Turn(`U`)">U</button>
		<button onclick="Faces.Turn(`D`)">D</button>
		<button onclick="Faces.Turn(`R`)">R</button>
		<button onclick="Faces.Turn(`L`)">L</button>
		<button onclick="Faces.Turn(`F`)">F</button>
		<button onclick="Faces.Turn(`B`)">B</button>
		<br>
		<button onclick="Faces.Turn(`U'`)">U'</button>
		<button onclick="Faces.Turn(`D'`)">D'</button>
		<button onclick="Faces.Turn(`R'`)">R'</button>
		<button onclick="Faces.Turn(`L'`)">L'</button>
		<button onclick="Faces.Turn(`F'`)">F'</button>
		<button onclick="Faces.Turn(`B'`)">B'</button>
		<br>
		<button onclick="Faces.Turn(`U2`)">U2</button>
		<button onclick="Faces.Turn(`D2`)">D2</button>
		<button onclick="Faces.Turn(`R2`)">R2</button>
		<button onclick="Faces.Turn(`L2`)">L2</button>
		<button onclick="Faces.Turn(`F2`)">F2</button>
		<button onclick="Faces.Turn(`B2`)">B2</button>
		<br>
		<button onclick="Faces.Turn(`x`)">x</button>
		<button onclick="Faces.Turn(`y`)">y</button>
		<button onclick="Faces.Turn(`z`)">z</button>
		<button onclick="Faces.Turn(`x'`)">x'</button>
		<button onclick="Faces.Turn(`y'`)">y'</button>
		<button onclick="Faces.Turn(`z'`)">z'</button>
		<br>
		<button onclick="Faces.Turn(`x2`)">x2</button>
		<button onclick="Faces.Turn(`y2`)">y2</button>
		<button onclick="Faces.Turn(`z2`)">z2</button>
		<button onclick="Faces.Turn(`M`)">M</button>
		<button onclick="Faces.Turn(`E`)">E</button>
		<button onclick="Faces.Turn(`S`)">S</button>
		<br>
		<button onclick="Faces.Turn(`M'`)">M'</button>
		<button onclick="Faces.Turn(`E'`)">E'</button>
		<button onclick="Faces.Turn(`S'`)">S'</button>
		<button onclick="Faces.Turn(`M2`)">M2</button>
		<button onclick="Faces.Turn(`E2`)">E2</button>
		<button onclick="Faces.Turn(`S2`)">S2</button>
	</div>
	<script src="Rubik's Cube.js"></script>
</body>

</html>
